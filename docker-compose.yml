version: '3.8'
services:
  traefik:
    image: traefik:v3.1
    container_name: atendit-proxy
    environment:
      - DOCKER_API_VERSION=1.41
    restart: always
    # Pico MEDIDO em 2026-09-03: 182MB. Era o UNICO container sem teto nenhum,
    # entao um vazamento aqui competiria com o Postgres pela RAM da maquina.
    mem_limit: 256m
    memswap_limit: 384m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    command:
    - --providers.docker=true
    - --providers.docker.exposedbydefault=false
    - --providers.file.directory=/etc/traefik/dynamic
    - --providers.file.watch=true
    - --entrypoints.web.address=:80
    - --entrypoints.web.http.redirections.entrypoint.to=websecure
    - --entrypoints.web.http.redirections.entrypoint.scheme=https
    - --entrypoints.websecure.address=:443
    - --certificatesresolvers.le.acme.email=${LE_EMAIL}
    - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
    - --certificatesresolvers.le.acme.tlschallenge=true
    ports:
    - 80:80
    - 443:443
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
    - ./traefik/acme.json:/letsencrypt/acme.json
    - ./traefik/dynamic:/etc/traefik/dynamic:ro
    networks:
    - atendit_network
  postgres:
    image: pgvector/pgvector:pg16
    container_name: atendit-db
    mem_limit: 384m
    restart: always
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atendit_db}
      POSTGRES_USER: ${POSTGRES_USER:-atendit_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER:-atendit_user} -d ${POSTGRES_DB:-atendit_db}
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
    - atendit_network
  redis:
    image: redis:7-alpine
    container_name: atendit-cache
    mem_limit: 128m
    restart: always
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    command: redis-server --requirepass ${REDIS_PASSWORD:-SenhaRedisSegura2026}
    volumes:
    - redis_data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - -a
      - ${REDIS_PASSWORD:-SenhaRedisSegura2026}
      - ping
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
    - atendit_network
  api:
    build: ./backend
    container_name: atendit-api
    mem_limit: 384m
    restart: always
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-atendit_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-atendit_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-SenhaRedisSegura2026}@redis:6379/0
      GEMINI_DEFAULT_KEY: ${GEMINI_API_KEY}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      CALENDAR_ENCRYPTION_KEY: ${CALENDAR_ENCRYPTION_KEY}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      PANEL_SESSION_SECRET: ${PANEL_SESSION_SECRET}
      ADMIN_NOTIFICATION_PHONE: ${ADMIN_NOTIFICATION_PHONE:-5585989020465}
      ADMIN_NOTIFICATION_INSTANCE: ${ADMIN_NOTIFICATION_INSTANCE:-atendit_manitest}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
      MICROSOFT_OAUTH_CLIENT_ID: ${MICROSOFT_OAUTH_CLIENT_ID}
      MICROSOFT_OAUTH_CLIENT_SECRET: ${MICROSOFT_OAUTH_CLIENT_SECRET}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://atendit.smartinovat.com}
      EVOLUTION_API_URL: http://evolution-api:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      RAG_STORAGE_PATH: /workspace/storage/tenants
      ENVIRONMENT: production
    volumes:
    - rag_storage:/workspace/storage/tenants
    - ./backend/app:/workspace/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
    - traefik.enable=true
    - traefik.http.services.api.loadbalancer.server.port=8000
    - traefik.http.routers.presenthia.rule=Host(`presenthia-console.smartinovat.com`)
    - traefik.http.routers.presenthia.entrypoints=websecure
    - traefik.http.routers.presenthia.tls.certresolver=le
    - traefik.http.routers.presenthia.service=api
    - traefik.http.routers.legacy-api.rule=Host(`atendit.smartinovat.com`)
    - traefik.http.routers.legacy-api.entrypoints=websecure
    - traefik.http.routers.legacy-api.tls.certresolver=le
    - traefik.http.routers.legacy-api.service=api
    networks:
    - atendit_network
  celery_worker:
    build: ./backend
    container_name: atendit-celery-worker
    # Pico MEDIDO: 236MB contra teto de 256m -- 92%. Foi ISTO que produziu
    # os 4 OOM-kill (CONSTRAINT_MEMCG) entre 07h39 e 08h01 de 2026-09-03.
    mem_limit: 320m
    memswap_limit: 480m
    restart: always
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info --concurrency=1
    healthcheck:
      test:
      - CMD-SHELL
      - celery -A app.core.celery_app.celery_app inspect ping -t 20 | grep -q pong
      interval: 60s
      timeout: 45s
      retries: 3
      start_period: 60s
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-atendit_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-atendit_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-SenhaRedisSegura2026}@redis:6379/0
      GEMINI_DEFAULT_KEY: ${GEMINI_API_KEY}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      CALENDAR_ENCRYPTION_KEY: ${CALENDAR_ENCRYPTION_KEY}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      PANEL_SESSION_SECRET: ${PANEL_SESSION_SECRET}
      ADMIN_NOTIFICATION_PHONE: ${ADMIN_NOTIFICATION_PHONE:-5585989020465}
      ADMIN_NOTIFICATION_INSTANCE: ${ADMIN_NOTIFICATION_INSTANCE:-atendit_manitest}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
      MICROSOFT_OAUTH_CLIENT_ID: ${MICROSOFT_OAUTH_CLIENT_ID}
      MICROSOFT_OAUTH_CLIENT_SECRET: ${MICROSOFT_OAUTH_CLIENT_SECRET}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://atendit.smartinovat.com}
      EVOLUTION_API_URL: http://evolution-api:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      RAG_STORAGE_PATH: /workspace/storage/tenants
    volumes:
    - rag_storage:/workspace/storage/tenants
    - ./backend/app:/workspace/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
    - atendit_network
  celery_beat:
    build: ./backend
    container_name: atendit-celery-beat
    mem_limit: 160m
    restart: always
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    command: celery -A app.core.celery_app beat --loglevel=info
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-atendit_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-atendit_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-SenhaRedisSegura2026}@redis:6379/0
      GEMINI_DEFAULT_KEY: ${GEMINI_API_KEY}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      CALENDAR_ENCRYPTION_KEY: ${CALENDAR_ENCRYPTION_KEY}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      PANEL_SESSION_SECRET: ${PANEL_SESSION_SECRET}
      ADMIN_NOTIFICATION_PHONE: ${ADMIN_NOTIFICATION_PHONE:-5585989020465}
      ADMIN_NOTIFICATION_INSTANCE: ${ADMIN_NOTIFICATION_INSTANCE:-atendit_manitest}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
      MICROSOFT_OAUTH_CLIENT_ID: ${MICROSOFT_OAUTH_CLIENT_ID}
      MICROSOFT_OAUTH_CLIENT_SECRET: ${MICROSOFT_OAUTH_CLIENT_SECRET}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://atendit.smartinovat.com}
      EVOLUTION_API_URL: http://evolution-api:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      RAG_STORAGE_PATH: /workspace/storage/tenants
    volumes:
    - rag_storage:/workspace/storage/tenants
    - ./backend/app:/workspace/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
    - atendit_network
  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: atendit-whatsapp-gateway
    restart: always
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    # Pico MEDIDO em 2026-09-03: 368MB. 512m da 39% de folga.
    # Estava em 1024m numa VPS de 956MB -- teto acima da RAM total nao
    # contem nada, e o Docker ja o reportava truncado.
    mem_limit: 512m
    memswap_limit: 768m   # 512 RAM + 256 swap; sem isto o swap iguala o limite
    environment:
      SERVER_URL: https://atendit.smartinovat.com
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      SYNC_FULL_HISTORY: "false"
      CONFIG_SESSION_PHONE_CLIENT: "ATENDIT SmartInovat"
      CONFIG_SESSION_PHONE_NAME: "Chrome"

      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER:-atendit_user}:${POSTGRES_PASSWORD}@postgres:5432/evolution?connection_limit=60&pool_timeout=60
      REDIS_ENABLED: 'false'
      REDIS_URI: ''
      CACHE_REDIS_ENABLED: 'false'
      CACHE_REDIS_URI: ''
      CACHE_LOCAL_ENABLED: 'true'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
    - traefik.enable=true
    - traefik.http.routers.evolution.rule=Host(`atendit.smartinovat.com`) && PathPrefix(`/evolution`)
    - traefik.http.routers.evolution.entrypoints=websecure
    - traefik.http.routers.evolution.tls.certresolver=le
    - traefik.http.services.evolution.loadbalancer.server.port=8080
    networks:
    - atendit_network
volumes:
  postgres_data: null
  redis_data: null
  rag_storage: null
networks:
  atendit_network:
    driver: bridge
