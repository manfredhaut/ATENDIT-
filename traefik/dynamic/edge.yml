http:
  routers:
    api-dev-aberta:
      rule: 'Host(`atendit.smartinovat.com`)'
      entryPoints:
        - websecure
      service: api-upstream
      priority: 1000
      tls: {}

  services:
    api-upstream:
      loadBalancer:
        servers:
          - url: "http://atendit-api:8000"
